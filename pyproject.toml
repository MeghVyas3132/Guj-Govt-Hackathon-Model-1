[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-registry"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "geoalchemy2>=0.15",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "shapely>=2.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "arq>=0.26",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "testcontainers[postgres]>=4.8", "ruff>=0.7"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Makes scripts/ importable from tests; the editable install only exposes app/.
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly: ruff's default set varies by version, and an unpinned
# config means two developers on different ruff versions see different errors.
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
# The local alembic/ directory makes ruff infer the alembic library as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Alembic files follow alembic's conventions, not ours. env.py must import models
# after context setup (E402); a migration with no operations legitimately leaves
# sa/op/geoalchemy2 unused (F401).
"alembic/env.py" = ["E402"]
"alembic/versions/*" = ["E501", "F401", "I001"]
# FastAPI's dependency-injection idiom *is* a function call in an argument default:
# Depends(), Query(), File(). B008 flags all three. Restructuring the routers to
# satisfy it would mean giving up FastAPI's signature-driven validation and OpenAPI
# generation, so the rule is disabled for routers only, not project-wide.
"app/api/v1/routers/*" = ["B008"]
